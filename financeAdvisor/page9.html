<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FinancePro Compound Interest Calculator</title>

<link rel="stylesheet" href="page9.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<header>

<h1>FinancePro</h1>
<p>Compound Interest Calculator</p>

</header>


<div class="container">

<div class="calculator">

<h2>Calculate Compound Interest</h2>

<label>Principal Amount (₹)</label>
<input type="number" id="principal" placeholder="e.g. 100000">

<label>Interest Rate (%)</label>
<input type="number" id="rate" placeholder="e.g. 8">

<label>Time Period (Years)</label>
<input type="number" id="years" placeholder="e.g. 10">

<label>Compounding Frequency</label>

<select id="frequency">

<option value="1">Yearly</option>
<option value="4">Quarterly</option>
<option value="12">Monthly</option>

</select>

<button onclick="calculateCompound()">Calculate</button>

</div>


<div class="results">

<h2>Result Summary</h2>

<p>Principal Amount : ₹ <span id="principalOut">0</span></p>

<p>Total Interest : ₹ <span id="interestOut">0</span></p>

<p>Final Amount : ₹ <span id="finalOut">0</span></p>

</div>

</div>


<div class="chartBox">

<canvas id="compoundChart"></canvas>

</div>


<script src="page9.js"></script>

</body>

</html>
