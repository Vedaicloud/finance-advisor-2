<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FinancePro Stock Profit Calculator</title>

<link rel="stylesheet" href="page11.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<header>

<h1>FinancePro</h1>
<p>Stock Profit / Loss Calculator</p>

</header>


<div class="container">

<div class="calculator">

<h2>Stock Trade Details</h2>

<label>Buy Price (₹)</label>
<input type="number" id="buyPrice" placeholder="e.g. 500">

<label>Sell Price (₹)</label>
<input type="number" id="sellPrice" placeholder="e.g. 650">

<label>Quantity</label>
<input type="number" id="quantity" placeholder="e.g. 20">

<button onclick="calculateStock()">Calculate</button>

</div>


<div class="results">

<h2>Trade Summary</h2>

<p>Total Investment : ₹ <span id="investment">0</span></p>

<p>Total Return : ₹ <span id="return">0</span></p>

<p id="profitText">Profit / Loss : ₹ <span id="profit">0</span></p>

<p>Profit Percentage : <span id="percentage">0</span> %</p>

</div>

</div>


<div class="chartBox">

<canvas id="stockChart"></canvas>

</div>

<script src="page11.js"></script>

</body>
</html>
