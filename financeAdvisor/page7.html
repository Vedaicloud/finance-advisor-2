<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FinancePro Expense Tracker</title>

<link rel="stylesheet" href="page7.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<header>

<h1>FinancePro</h1>
<p>Expense Tracker</p>

</header>


<div class="container">

<div class="form">

<h2>Add Expense</h2>

<input type="text" id="title" placeholder="Expense name">

<select id="category">

<option>Food</option>
<option>Transport</option>
<option>Bills</option>
<option>Shopping</option>
<option>Other</option>

</select>

<input type="number" id="amount" placeholder="Amount">

<input type="date" id="date">

<button onclick="addExpense()">Add Expense</button>

</div>


<div class="summary">

<h2>Total Expenses</h2>

<h3>₹ <span id="total">0</span></h3>

</div>

</div>


<div class="table-container">

<table>

<thead>

<tr>

<th>Title</th>
<th>Category</th>
<th>Amount</th>
<th>Date</th>
<th>Action</th>

</tr>

</thead>

<tbody id="expenseList">

</tbody>

</table>

</div>


<div class="chartBox">

<canvas id="expenseChart"></canvas>

</div>


<script src="page7.js"></script>

</body>

</html>
