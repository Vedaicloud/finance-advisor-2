
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FinancePro Investment Calculator</title>

<link rel="stylesheet" href="page8.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<header>

<h1>FinancePro</h1>
<p>Investment Growth Calculator</p>

</header>


<div class="container">

<div class="calculator">

<h2>Calculate Investment Growth</h2>

<label>Initial Investment (₹)</label>
<input type="number" id="initial" placeholder="e.g. 50000">

<label>Monthly Contribution (₹)</label>
<input type="number" id="monthly" placeholder="e.g. 5000">

<label>Expected Annual Return (%)</label>
<input type="number" id="rate" placeholder="e.g. 10">

<label>Investment Period (Years)</label>
<input type="number" id="years" placeholder="e.g. 15">

<button onclick="calculateInvestment()">Calculate</button>

</div>


<div class="results">

<h2>Investment Summary</h2>

<p>Total Invested : ₹ <span id="invested">0</span></p>

<p>Total Profit : ₹ <span id="profit">0</span></p>

<p>Final Portfolio Value : ₹ <span id="total">0</span></p>

</div>

</div>


<div class="chartBox">

<canvas id="investmentChart"></canvas>

</div>

<script src="page8.js"></script>

</body>
</html>
